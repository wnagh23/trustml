# Protokol oceny, zamrozony w E4. Podzial robi etap 8 pipeline'u, tu jest jego opis.
# Po kazdej zmianie model.parquet trzeba recznie wpisac nowy sha256.

wersja: 1
zamrozony: 2026-08-29

dane:
  sciezka: data/processed/model.parquet
  sha256: 0703e0cf2029eb65f11217e2ba62dec853b6d7f435c3e2c890fbb53c30be5aa5
  wiersze: 13709
  kolumny: 115

cel:
  glowny: log_market_value        # log1p(market_value_in_eur), D-04
  zdeflowany: log_market_value_real
  w_euro: market_value_in_eur

# Podzial zewnetrzny: czasowy (D-16)
podzial_zewnetrzny:
  kolumna: podzial
  klucz_obserwacji: [player_id, season]
  zbiory:
    trening:
      sezony: ["2017-2018", "2018-2019", "2020-2021", "2021-2022"]
      ligi: Big 5
      wiersze: 7924
    kalibracja:
      sezony: ["2022-2023"]
      ligi: Big 5
      wiersze: 1982
    test:
      sezony: ["2023-2024"]
      ligi: Big 5
      wiersze: 1957
    zbior_C:
      sezony: ["2018-2019", "2020-2021", "2021-2022", "2022-2023", "2023-2024"]
      ligi: Primeira_Liga
      wiersze: 1846
  # sprawdzane w etapie 8 i w tests/test_no_leakage.py
  liga_wylacznie_w_zbiorze_c: Primeira_Liga
  # Ligue 1 rozegrala 279 z 380 meczow
  brakujacy_sezon: "2019-2020"

# Podzial wewnetrzny: strojenie hiperparametrow, tylko na treningu
podzial_wewnetrzny:
  metoda: GroupKFold
  kolumna_grupujaca: player_id
  n_podzialow: 5
  tasowanie: false          # deterministyczny podzial

# Wynik glowny na jednym sezonie testowym, rolling origin w E7 (D-22)
wynik_glowny:
  zbior: test
  liczba_par: 1957
  rolling_origin: E7

# Powrot ze skali log do euro (D-21, D-24)
retransformacja:
  metoda: duan
  zrodlo_reszt: trening     # reszty testowe bylyby wyciekiem
  # metryki bez korekty; korekta tylko w sumie wycen
  skorygowane: [agregat_po_korekcie]
  nieskorygowane: [rmsle, r2_log, mdape, mae_eur, mape, agregat]
  diagnostyka: agregat      # suma predykcji / suma prawdy, ma byc blisko 1

# Metryki (D-15)
metryki:
  glowne: [rmsle, mdape]
  pomocnicze: [r2_log, mae_eur, krotnosc, agregat]
  do_porownan_historycznych: [mape]

# Kazdy wynik raportuje tez w podziale na te osie (D-12)
osie_stratyfikacji: [znany_z_treningu, pozycja, liga]

# Poziomy odniesienia (D-06)
poziomy_odniesienia:
  M0a:
    opis: mediana globalna ze zbioru treningowego
  M0b:
    opis: mediana w komorce
    kolumny: [pozycja, liga]  # bez sezonu, bo sezonu testu nie ma w treningu (D-23)
  M0c:
    opis: przepisanie wyceny z sezonu poprzedniego
    zrodlo: wszystkie sezony wczesniejsze niz oceniany
    # wynik na podzbiorze z pokryciem i na calym tescie z brakami z M0b
    warianty: [podzbior_z_pokryciem, pelny_zbior_uzupelniony_M0b]

decyzje: [D-04, D-05, D-06, D-12, D-13, D-15, D-16, D-21, D-22, D-23, D-24]
