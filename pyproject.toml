[project]
name = "trustml"
version = "0.1.0"
description = "Framework oceny wiarygodności modeli uczenia maszynowego"
readme = "README.md"
authors = [
    { name = "Wojciech", email = "wnagh@student.agh.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff.lint.isort]
# Moduly pipeline'u lezace obok siebie w case_study/football - bez tego ruff
# traktuje je jak biblioteki zewnetrzne i wciska miedzy pandas a numpy.
known-local-folder = ["parametry", "zrodla", "cechy", "wycena", "zbiory"]
