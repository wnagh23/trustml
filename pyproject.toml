[project]
name = "trustml"
version = "0.1.0"
description = "Framework oceny wiarygodności modeli uczenia maszynowego"
readme = "README.md"
authors = [
    { name = "Wojciech", email = "wnagh@student.agh.edu.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    # protokol podzialu mieszka w configs/split.yaml
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff.lint.isort]
known-local-folder = ["parametry", "zrodla", "cechy", "wycena", "zbiory"]
