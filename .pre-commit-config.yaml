# Instalacja po sklonowaniu repozytorium:
#     uv run pre-commit install
#
# Uruchomienie na calym repozytorium bez commitowania:
#     uv run pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # Formatowanie: wciecia, dlugosc linii, cudzyslowy. Poprawia w miejscu.
      - id: ruff-format
      # Linter: nieuzywane importy, kolejnosc importow, martwy kod.
      - id: ruff
        args: [--fix]

  # Usuwa wyniki komorek z notatnikow Jupytera

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # Drobne higieny pliku - tanie i wylapuja typowe smieci.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Brak znaku nowej linii na koncu pliku psuje diffy.
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # Blokuje przypadkowe wrzucenie duzych plikow - dane maja zostac poza gitem.
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-toml
      - id: check-yaml
      # Wykrywa pliki rozniace sie tylko wielkoscia liter
      - id: check-case-conflict
